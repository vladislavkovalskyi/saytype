<style>
.well3 { position: absolute; left: 50px; top: 58px; width: 290px; height: 290px; border-radius: 54px; background: rgba(0,0,0,.32); box-shadow: inset 0 2px 14px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.05); z-index: 2; }
.cap3d { position: absolute; left: 70px; top: 82px; width: 250px; height: 246px; border-radius: 42px; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: #fff; z-index: 3;
  background: linear-gradient(180deg, oklch(0.68 0.12 232), oklch(0.48 0.12 238));
  box-shadow: inset 0 2px 0 rgba(255,255,255,.38), inset 0 -4px 0 rgba(0,0,0,.22), 0 3px 0 oklch(0.3 0.08 238), 0 0 100px oklch(0.72 0.15 232 / .7), 0 0 0 1px oklch(0.85 0.1 232 / .5); }
.cap3d .fn { position: absolute; top: 28px; right: 34px; font-size: 42px; font-weight: 500; letter-spacing: -.01em; }
.cap3d .gl { position: absolute; bottom: 30px; left: 32px; }
.read { position: absolute; left: 392px; top: 54px; width: 444px; z-index: 3; }
.big { font-family: "Unbounded", "Onest", sans-serif; font-size: 46px; font-weight: 600; letter-spacing: -.02em; line-height: 1; margin-top: 10px; }
.meter { position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); margin-top: 22px; }
.meter b { position: absolute; left: 0; top: 0; bottom: 0; width: 70%; border-radius: 4px; background: linear-gradient(90deg, oklch(0.78 0.1 232), #f7f3ec); }
.meter i { position: absolute; left: 50%; top: -7px; bottom: -7px; width: 1.5px; background: rgba(255,255,255,.7); }
.scale { display: flex; justify-content: space-between; margin-top: 10px; }
.alts { display: flex; gap: 10px; margin-top: 12px; }
.kc { height: 58px; padding: 0 14px; border-radius: 13px; display: flex; flex-direction: column; justify-content: center; gap: 3px; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 14px; color: rgba(255,255,255,.82); background: linear-gradient(180deg, #34343b, #24242a); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 4px 0 #111114, 0 8px 16px rgba(0,0,0,.35); }
.kc small { font-size: 10.5px; color: rgba(255,255,255,.45); }
</style>
<div class="stage">
<div class="win" style="[[field 232]]">
  [[chrome 3]]
  <div class="well3"></div>
  <div class="cap3d"><span class="fn">fn</span><span class="gl">[[i globe 34 1.5]]</span></div>

  <div class="read">
    <div class="ml">удержание</div>
    <div class="big">0,42 с</div>
    <div class="meter"><b></b><i></i></div>
    <div class="scale"><span class="ml">нажатие</span><span class="ml">0,30 с</span><span class="ml">запись</span></div>

    <div class="ml" style="margin-top: 26px;">другая клавиша</div>
    <div class="alts">
      <div class="kc">⌥<small>правый option</small></div>
      <div class="kc">⌘<small>правый command</small></div>
      <div class="kc">⌃⌥ Space<small>сочетание</small></div>
    </div>
  </div>

  <div class="layer glass" style="left: 392px; top: 324px; height: 42px; border-radius: 21px; padding: 0 5px 0 14px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; white-space: nowrap; color: rgba(246,243,238,.9);">
    <span style="color: oklch(0.85 0.14 80);">[[i warn 16]]</span>
    <span>Globe открывает панель эмодзи</span>
    <span class="btn btn-sm btn-primary" style="height: 32px;">Отключить</span>
  </div>

  <h1 class="title">Клавиша</h1>
  <p class="lede">Держать: запись. Отпустить: вставка. Двойное нажатие: запись без рук.</p>
  <div class="actions"><span class="btn btn-ghost">Назад</span><span class="btn btn-primary">Дальше</span></div>
</div>
</div>
