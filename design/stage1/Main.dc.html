<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Onest", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; background: #e9e5df; color: #fff; }
    a { color: #ffd9a8; } a:hover { color: #fff; }
    p, h1 { margin: 0; }
    .stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .win { position: relative; width: 960px; height: 640px; border-radius: 22px; overflow: hidden;
      background:
        radial-gradient(55% 60% at 26% 30%, rgba(255, 214, 160, .55), transparent 70%),
        radial-gradient(60% 70% at 100% 100%, rgba(90, 16, 52, .85), transparent 70%),
        linear-gradient(150deg, #f39a45 0%, #e4652f 34%, #c73a36 64%, #7c1f3d 100%);
      box-shadow: 0 0 0 .5px rgba(0,0,0,.4), 0 40px 90px -20px rgba(80, 20, 20, .55), 0 12px 30px rgba(0,0,0,.18); }
    .win::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), inset 0 1px 0 rgba(255,255,255,.3); pointer-events: none; }
    .bar { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.9); }
    .lights { position: absolute; left: 18px; top: 16px; display: flex; gap: 8px; }
    .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
    .hero { position: absolute; left: -10px; top: 150px; width: 600px; }
    .halo { position: absolute; left: 30px; top: 110px; width: 540px; height: 380px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 240, 220, .5), transparent); }
    .col { position: absolute; left: 596px; top: 150px; width: 320px; }
    .title { font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
    .sub { margin-top: 12px; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.82); }
    .rows { margin-top: 30px; display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; align-items: center; gap: 14px; }
    .row img { width: 44px; height: 44px; flex: none; }
    .row b { display: block; font-size: 15px; font-weight: 600; }
    .row span { display: block; margin-top: 1px; font-size: 13px; color: rgba(255,255,255,.72); }
    .cta { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #fff;
      background: radial-gradient(circle at 34% 28%, #ffe2bd 0%, #ff9a4d 38%, #e9483a 74%, #b62b3e 100%);
      box-shadow: 0 0 0 7px rgba(255,255,255,.14), 0 0 0 1px rgba(255,255,255,.35) inset, 0 16px 40px rgba(150, 30, 40, .55), 0 0 60px rgba(255, 150, 90, .55); }
  </style>
</helmet>
<div class="stage">
  <div class="win">
    <div class="bar"><div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>voicemode</div>

    <div class="halo"></div>
    <img class="hero" src="capsule.webp" alt="">

    <div class="col">
      <h1 class="title">voicemode</h1>
      <p class="sub">Голосовой ввод для macOS. Распознаёт речь на этом Mac, без интернета.</p>
      <div class="rows">
        <div class="row"><img src="keycap-sm.webp" alt=""><div><b>Зажми fn</b><span>и говори в любом приложении</span></div></div>
        <div class="row"><img src="textcard-sm.webp" alt=""><div><b>Готовый текст</b><span>запятые, абзацы, списки</span></div></div>
        <div class="row"><img src="lock-sm.webp" alt=""><div><b>Офлайн</b><span>голос не покидает Mac</span></div></div>
      </div>
    </div>

    <div class="cta">Начать</div>
  </div>
</div>
</x-dc>
</body>
</html>
