name: voicemode
options:
  bundleIdPrefix: dev.kovalskyi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: SHFR8S4R37
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  VoicemodeKit:
    path: Packages/VoicemodeKit

targets:
  Voicemode:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "Fonts/*.txt"
      - path: App/Resources/Fonts/Onest-OFL.txt
        buildPhase: resources
      - path: App/Resources/Fonts/JetBrainsMono-OFL.txt
        buildPhase: resources
    dependencies:
      - package: VoicemodeKit
        product: VMCore
      - package: VoicemodeKit
        product: VMAudio
      - package: VoicemodeKit
        product: VMTranscription
      - package: VoicemodeKit
        product: VMSystem
    entitlements:
      path: App/Voicemode.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: voicemode
        CFBundleName: voicemode
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSMicrophoneUsageDescription: voicemode слушает микрофон, пока зажата клавиша записи. Звук распознаётся на этом Mac и никуда не отправляется.
        NSHumanReadableCopyright: © 2026 voicemode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kovalskyi.voicemode
        PRODUCT_NAME: voicemode
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
