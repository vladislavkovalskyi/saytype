name: voicemode
options:
  bundleIdPrefix: dev.kovalskyi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: SHFR8S4R37
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  VoicemodeKit:
    path: Packages/VoicemodeKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

targets:
  Voicemode:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "Fonts/*.txt"
      - path: App/Resources/Fonts/Onest-OFL.txt
        buildPhase: resources
      - path: App/Resources/Fonts/JetBrainsMono-OFL.txt
        buildPhase: resources
    dependencies:
      - package: VoicemodeKit
        product: VMCore
      - package: VoicemodeKit
        product: VMAudio
      - package: VoicemodeKit
        product: VMTranscription
      - package: VoicemodeKit
        product: VMSystem
      - package: VoicemodeKit
        product: VMSmart
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: App/Voicemode.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: voicemode
        CFBundleName: voicemode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        # Translations live in App/Resources/InfoPlist.xcstrings.
        NSMicrophoneUsageDescription: voicemode listens to the microphone while the record key is held. Audio is transcribed on this Mac and never leaves it.
        NSHumanReadableCopyright: © 2026 voicemode
        # Sparkle 2. Generate the key pair with Sparkle's generate_keys and paste the public
        # key here; docs/RELEASING.md has the steps. The updater stays off while the
        # placeholder is in place.
        SUFeedURL: https://vladislavkovalskyi.github.io/voicemode/appcast.xml
        SUPublicEDKey: REPLACE_WITH_SPARKLE_PUBLIC_KEY
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kovalskyi.voicemode
        PRODUCT_NAME: voicemode
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        # English source strings; Localizable.xcstrings and InfoPlist.xcstrings hold the translations.
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
